<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SrivyaRadio - Browse and listen to radio stations from around the world">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SrivyaRadio - Adaptive Radio Player</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon.png">
    <link rel="apple-touch-icon" href="icons/icon.png">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container">
        <header class="main-header">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo">
                        <img src="https://raw.githubusercontent.com/Srivyaa/RadioStations-old/main/ic_radiologo.png"
                            alt="SrivyaRadio Logo" width="60" height="60" loading="lazy">
                    </div>
                    <div class="brand-text">
                        <h1>SrivyaRadio</h1>
                        <p class="description">Browse and listen to radio stations from around the world</p>
                    </div>
                </div>

                <div class="header-controls">
                    <div class="search-container">
                        <div class="search-box">
                            <input type="text" class="search-input" id="searchInput" placeholder="Search stations..."
                                aria-label="Search radio stations" autocomplete="off">
                            <button class="search-btn" id="searchBtn" aria-label="Search">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <path d="M21 21l-4.35-4.35"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode"
                        title="Toggle dark mode">
                        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <aside class="categories-panel">
                <div class="panel-header">
                    <h2>Categories</h2>
                    <span class="category-count" id="categoryCount">0</span>
                </div>
                <ul class="category-list" id="categoryList" role="listbox" aria-label="Radio categories">
                    <!-- Categories loaded dynamically -->
                </ul>
            </aside>

            <section class="stations-section">
                <div class="section-header">
                    <div class="stations-info">
                        <h2 id="stationsTitle">Stations</h2>
                        <span class="station-count" id="stationCount">Select a category</span>
                    </div>
                    <div class="stations-actions">
                        <button class="action-btn" id="favoritesBtn" aria-label="Show favorites" title="Favorites">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path
                                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                                </path>
                            </svg>
                        </button>
                    </div>
                </div>
                <ul class="station-list" id="stationList" role="listbox" aria-label="Radio stations">
                    <!-- Stations loaded dynamically -->
                </ul>
                <div class="loading-skeleton" id="loadingSkeleton" aria-hidden="true">
                    <!-- Skeleton loaders -->
                </div>
            </section>
        </main>

        <div class="player-bar" id="playerBar">
            <div class="player-content">
                <div class="player-info">
                    <div class="station-image" id="stationImage">
                        <div class="placeholder-icon">📻</div>
                    </div>
                    <div class="station-details">
                        <h3 class="station-title" id="stationTitle">No station selected</h3>
                        <p class="station-meta" id="stationMeta">Select a station to start listening</p>
                    </div>
                </div>

                <div class="player-controls">
                    <button class="control-btn" id="shuffleBtn" aria-label="Shuffle" title="Shuffle">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polyline points="16 3 21 3 21 8"></polyline>
                            <line x1="4" y1="20" x2="21" y2="3"></line>
                            <polyline points="21 16 21 21 16 21"></polyline>
                            <line x1="15" y1="15" x2="21" y2="21"></line>
                            <line x1="4" y1="4" x2="9" y2="9"></line>
                        </svg>
                    </button>
                    <button class="control-btn" id="prevBtn" aria-label="Previous" title="Previous">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polygon points="19 20 9 12 19 4 19 20"></polygon>
                            <line x1="5" y1="19" x2="5" y2="5"></line>
                        </svg>
                    </button>
                    <button class="control-btn play-btn" id="playPauseBtn" aria-label="Play" title="Play">
                        <svg class="icon-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        <svg class="icon-pause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"
                            style="display:none">
                            <rect x="6" y="4" width="4" height="16"></rect>
                            <rect x="14" y="4" width="4" height="16"></rect>
                        </svg>
                    </button>
                    <button class="control-btn" id="nextBtn" aria-label="Next" title="Next">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polygon points="5 4 15 12 5 20 5 4"></polygon>
                            <line x1="19" y1="5" x2="19" y2="19"></line>
                        </svg>
                    </button>
                    <button class="control-btn" id="loopBtn" aria-label="Loop" title="Loop">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polyline points="17 1 21 5 17 9"></polyline>
                            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                            <polyline points="7 23 3 19 7 15"></polyline>
                            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                        </svg>
                    </button>
                </div>

                <div class="player-extras">
                    <button class="favorite-btn" id="favoriteBtn" aria-label="Add to favorites"
                        title="Add to favorites">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path
                                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                            </path>
                        </svg>
                    </button>
                    <div class="volume-control">
                        <button class="volume-btn" id="volumeBtn" aria-label="Mute" title="Mute/Unmute">
                            <svg class="icon-volume-high" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                            </svg>
                            <svg class="icon-volume-muted" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" style="display:none">
                                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                <line x1="23" y1="9" x2="17" y2="15"></line>
                                <line x1="17" y1="9" x2="23" y2="15"></line>
                            </svg>
                        </button>
                        <input type="range" min="0" max="100" value="50" class="volume-slider" id="volumeSlider"
                            aria-label="Volume">
                    </div>
                </div>
            </div>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <footer class="main-footer">
            <p>Radio data sourced from <a href="https://github.com/Srivyaa/RadioStations" target="_blank"
                    rel="noopener">Srivyaa/RadioStations</a></p>
        </footer>
    </div>

    <audio id="audioPlayer" preload="none"></audio>
    <script src="script.js"></script>
</body>

</html>
